<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>AquaBridge Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Familjen+Grotesk:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky header + one centred working column (max 1180px); screens swap inside <main>; two-pane layouts for editor, inbox and compatibility collapse to one column under 900px. */
:root {
  /* Palette "Coastal Trust" (light only): deep ocean ink, ocean teal actions, seafoam tints, coastal mist ground */
  color-scheme: light;
  --bg: #F4F8F7;          /* Coastal Mist: page ground */
  --surface: #FFFFFF;     /* Cards, forms, panels */
  --surface-2: #EAF3F0;   /* Quiet fills, table heads, build-notes strip */
  --line: #D3E3DE;        /* Borders and dividers */
  --ink: #12324A;         /* Deep Ocean: headings and body text */
  --ink-2: #4E6677;       /* Secondary text */
  --primary: #0B7A6E;     /* Ocean Teal: primary actions, links */
  --primary-hover: #08635A;
  --on-primary: #FFFFFF;
  --primary-soft: #DDF3EC; /* Seafoam tint: selected states, info panels */
  --weed: #5CC4A6;        /* Seafoam: logo wave and small highlights */
  --weed-soft: #C9EFE2;
  --ok: #1F7A4D;  --ok-soft: #DDF1E5;
  --warn: #965A00; --warn-soft: #FCEFD5;
  --bad: #B4352C;  --bad-soft: #FBE3E0;
  --mute-soft: #E6EEEC;
  --plate-trop: #D6EFE9; --plate-cold: #DEE8F2; --plate-plant: #E0EFD9; --plate-pond: #EDEBD5; --plate-ink: #12324A;
  --focus: #0B7A6E;

  --f-display: "Familjen Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;

  --t-xs: 0.8125rem; --t-sm: 0.9375rem; --t-md: 1rem; --t-lg: 1.25rem; --t-xl: 1.625rem; --t-2xl: 2.125rem; --t-3xl: clamp(2.25rem, 5vw, 3.25rem);
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px; --s8: 72px;
  --r: 6px; --r-sm: 3px;
  --maxw: 1180px;
}

*, *::before, *::after { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: var(--t-md); line-height: 1.55; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: var(--t-2xl); font-weight: 700; }
h2 { font-size: var(--t-xl); font-weight: 650; }
h3 { font-size: var(--t-lg); font-weight: 600; }
p { margin: 0; }
a { color: var(--primary); text-underline-offset: 3px; }
a:hover { color: var(--primary-hover); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 2px; }
.mono { font-family: var(--f-mono); font-size: 0.875em; font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: var(--t-sm); }
.label { font-family: var(--f-mono); font-size: var(--t-xs); text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); }
.wrap { max-width: var(--maxw); margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.skip { position: absolute; left: -9999px; }
.skip:focus { left: 16px; top: 16px; z-index: 50; background: var(--surface); padding: var(--s2) var(--s3); }
.stack { display: grid; gap: var(--s4); }
.stack-lg { display: grid; gap: var(--s6); }
.row { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; }
.between { justify-content: space-between; }

/* Header */
.site-head { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.head-row { display: flex; align-items: center; gap: var(--s5); min-height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--f-display); font-weight: 700; font-size: 1.375rem; letter-spacing: -0.02em; }
.brand svg { flex: none; }
.brand:hover { color: var(--ink); }
.nav { display: flex; align-items: center; gap: var(--s5); flex: 1; }
.nav-main { display: flex; align-items: center; gap: var(--s1); }
.nav-main a { font-family: var(--f-display); font-weight: 500; font-size: 1.0625rem; color: var(--ink); text-decoration: none; padding: 10px 14px; border-radius: var(--r-sm); }
.nav-main a:hover { background: var(--surface-2); color: var(--ink); }
.nav-main a[aria-current="page"] { color: var(--primary); box-shadow: inset 0 -3px 0 var(--primary); border-radius: 0; }
.acct { display: flex; align-items: center; gap: var(--s2); margin-left: auto; }
.acct .btn { font-size: 1rem; }
.acct .btn-quiet { color: var(--ink); }
.avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: 0.875rem; flex: none; }
.dd { position: relative; }
.dd-btn { display: flex; align-items: center; gap: 10px; font-family: var(--f-display); font-weight: 500; font-size: 1rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px 4px 4px; cursor: pointer; }
.dd-btn:hover, .dd-btn[aria-expanded="true"] { border-color: var(--ink-2); }
.dd-btn[data-current] { border-color: var(--primary); }
.dd-btn svg { transition: transform .15s; }
.dd-btn[aria-expanded="true"] svg { transform: rotate(180deg); }
.badge { min-width: 22px; height: 22px; padding: 0 7px; border-radius: 11px; background: var(--warn); color: #FFFFFF; font: 500 0.75rem/22px var(--f-mono); text-align: center; }
.dd-panel { display: none; position: absolute; right: 0; top: calc(100% + 10px); width: 280px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 14px 36px rgba(18, 50, 74, .14); padding: var(--s2); z-index: 30; }
.dd-panel.open { display: grid; }
.dd-who { padding: var(--s2) 12px var(--s3); border-bottom: 1px solid var(--line); font-size: var(--t-sm); color: var(--ink-2); }
.dd-who strong { display: block; color: var(--ink); font-family: var(--f-display); font-size: 1.0625rem; font-weight: 600; }
.dd-group { display: grid; padding: var(--s2) 0; border-bottom: 1px solid var(--line); }
.dd-label { font-family: var(--f-mono); font-size: 0.75rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-2); padding: 6px 12px 4px; }
.dd-item { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); width: 100%; padding: 10px 12px; border: 0; border-radius: var(--r-sm); background: none; color: var(--ink); font: inherit; font-size: 1rem; text-align: left; text-decoration: none; cursor: pointer; }
.dd-item:hover { background: var(--surface-2); color: var(--ink); }
.dd-item[aria-current="page"] { background: var(--primary-soft); color: var(--primary); font-weight: 700; }
.dd-item small { display: block; font-size: var(--t-xs); color: var(--ink-2); font-weight: 400; }
.dd-out { margin-top: var(--s1); color: var(--ink-2); }
.btn.menu-btn { display: none; margin-left: auto; font-size: 1rem; }
@media (max-width: 900px) {
  .btn.menu-btn { display: inline-flex; }
  .nav { display: none; position: absolute; left: 0; right: 0; top: 100%; background: var(--surface); border-bottom: 1px solid var(--line); box-shadow: 0 14px 30px rgba(18, 50, 74, .12); flex-direction: column; align-items: stretch; gap: var(--s2); padding: var(--s2) max(16px, env(safe-area-inset-right, 0px)) var(--s4) max(16px, env(safe-area-inset-left, 0px)); }
  .nav.open { display: flex; }
  .nav-main { flex-direction: column; align-items: stretch; }
  .nav-main a { padding: 12px; }
  .nav-main a[aria-current="page"] { box-shadow: inset 3px 0 0 var(--primary); background: var(--primary-soft); }
  .acct { margin-left: 0; flex-direction: column; align-items: stretch; border-top: 1px solid var(--line); padding-top: var(--s3); }
  .dd-btn { display: none; }
  .dd-panel { display: grid; position: static; width: auto; border: 0; box-shadow: none; padding: 0; }
}

/* Build notes strip */
.notes { background: var(--surface-2); border-bottom: 1px solid var(--line); font-family: var(--f-mono); font-size: var(--t-xs); color: var(--ink-2); }
.notes .wrap { display: flex; flex-wrap: wrap; gap: 6px 24px; padding-block: 8px; }
.notes b { color: var(--ink); font-weight: 500; }
.notes .who { color: var(--primary); }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: inherit; font-weight: 700; font-size: var(--t-sm); line-height: 1.2; padding: 11px 18px; border-radius: var(--r); border: 1px solid transparent; cursor: pointer; text-decoration: none; transition: background-color .15s, border-color .15s, color .15s; }
.btn-primary { background: var(--primary); color: var(--on-primary); }
.btn-primary:hover { background: var(--primary-hover); color: var(--on-primary); }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-secondary:hover { border-color: var(--ink-2); color: var(--ink); }
.btn-quiet { background: transparent; color: var(--primary); padding-inline: 8px; }
.btn-quiet:hover { background: var(--primary-soft); color: var(--primary); }
.btn-danger { background: var(--surface); color: var(--bad); border-color: var(--bad); }
.btn-danger:hover { background: var(--bad-soft); color: var(--bad); }
.btn-sm { padding: 7px 12px; font-size: var(--t-xs); }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; }

/* Chips: one shape for every contract status */
.chip { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-size: 0.75rem; font-weight: 500; letter-spacing: .02em; padding: 3px 9px 3px 8px; border-radius: 999px; white-space: nowrap; background: var(--mute-soft); color: var(--ink-2); }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.pri { background: var(--primary-soft); color: var(--primary); }
.chip.plain::before { display: none; }

/* Parameter readout — the test-kit strip used on cards and details */
.params { display: flex; flex-wrap: wrap; gap: 6px; }
.param { font-family: var(--f-mono); font-size: 0.75rem; border: 1px solid var(--line); border-radius: var(--r-sm); padding: 2px 7px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.param b { color: var(--ink); font-weight: 500; }

/* Specimen plate */
.plate { position: relative; display: flex; flex-direction: column; justify-content: flex-end; gap: 2px; padding: var(--s4); min-height: 132px; color: var(--plate-ink); overflow: hidden; }
.plate.trop { background: var(--plate-trop); } .plate.cold { background: var(--plate-cold); } .plate.plant { background: var(--plate-plant); } .plate.pond { background: var(--plate-pond); }
.plate .sci { font-family: var(--f-display); font-style: italic; font-weight: 500; font-size: 1.25rem; line-height: 1.15; max-width: 80%; }
.plate .kind { font-family: var(--f-mono); font-size: 0.6875rem; text-transform: uppercase; letter-spacing: .1em; opacity: .8; }
.plate svg { position: absolute; right: 12px; top: 12px; opacity: .55; }
.plate .tag { position: absolute; left: var(--s4); top: var(--s4); }

/* Listing cards */
.grid-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--s5); }
.lcard { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; text-decoration: none; color: var(--ink); transition: border-color .15s, transform .15s; }
.lcard:hover { border-color: var(--primary); color: var(--ink); }
.lcard .body { display: grid; gap: var(--s2); padding: var(--s4); flex: 1; align-content: start; }
.lcard h3 { font-size: 1.125rem; }
.lcard .meta { font-size: var(--t-sm); color: var(--ink-2); }
.lcard .foot { display: flex; justify-content: space-between; align-items: center; gap: var(--s2); padding: var(--s3) var(--s4); border-top: 1px solid var(--line); font-size: var(--t-xs); color: var(--ink-2); }
@media (prefers-reduced-motion: no-preference) { .lcard:hover { transform: translateY(-2px); } }

/* Panels and forms */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s5); }
.panel-quiet { background: var(--surface-2); border-radius: var(--r); padding: var(--s4) var(--s5); }
.field { display: grid; gap: 6px; }
.field > label, .field legend { font-weight: 700; font-size: var(--t-sm); }
.field .hint { font-size: var(--t-xs); color: var(--ink-2); }
.req { color: var(--bad); font-weight: 400; }
input[type=text], input[type=email], input[type=password], input[type=number], select, textarea {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 12px; width: 100%; min-width: 0;
}
input:hover, select:hover, textarea:hover { border-color: var(--ink-2); }
textarea { min-height: 112px; resize: vertical; }
.field.has-error input, .field.has-error select, .field.has-error textarea { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad); }
.err { color: var(--bad); font-size: var(--t-xs); font-weight: 700; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s4) var(--s5); }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: var(--s3); }
.choice { position: relative; display: grid; gap: 4px; padding: var(--s4); border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; }
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice strong { font-family: var(--f-display); font-size: 1.0625rem; font-weight: 600; }
.choice span { font-size: var(--t-sm); color: var(--ink-2); }
.choice:has(input:checked) { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); background: var(--primary-soft); }
.choice:has(input:focus-visible) { outline: 3px solid var(--focus); outline-offset: 2px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: var(--t-sm); }
.check input { margin-top: 4px; width: 18px; height: 18px; accent-color: var(--primary); }

/* Notices */
.notice { display: grid; gap: 4px; padding: var(--s3) var(--s4); border-radius: var(--r); border: 1px solid var(--line); background: var(--surface-2); font-size: var(--t-sm); }
.notice.pri { background: var(--primary-soft); border-color: transparent; }
.notice.warn { background: var(--warn-soft); border-color: transparent; }
.notice.bad { background: var(--bad-soft); border-color: transparent; }
.notice.ok { background: var(--ok-soft); border-color: transparent; }
.notice strong { font-family: var(--f-display); font-size: var(--t-md); }

/* Page heads */
.page { padding-block: var(--s6) var(--s8); }
.page-head { display: grid; gap: var(--s2); margin-bottom: var(--s6); }
.page-head p { max-width: 62ch; color: var(--ink-2); }
.page-head.row { display: flex; }
.crumb { font-size: var(--t-sm); }
.crumb a { text-decoration: none; }

/* Home */
.hero-wrap { background: var(--surface); border-bottom: 1px solid var(--line); }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: var(--s6); align-items: center; padding-block: var(--s6) var(--s7); }
.hero h1 { font-size: var(--t-3xl); line-height: 1.06; letter-spacing: -0.025em; max-width: 15ch; margin-top: var(--s3); }
.hero h1 em { font-style: normal; color: var(--primary); }
.hero .lede { font-size: 1.1875rem; line-height: 1.6; color: var(--ink-2); max-width: 44ch; margin-top: var(--s4); }
.hero-ctas { display: flex; flex-wrap: wrap; gap: var(--s3); margin-top: var(--s5); }
.btn-lg { padding: 15px 22px; font-size: 1.0625rem; }
.assure { list-style: none; padding: 0; margin: var(--s5) 0 0; display: flex; flex-wrap: wrap; gap: var(--s2) var(--s5); font-size: var(--t-sm); color: var(--ink-2); }
.assure li { display: flex; align-items: center; gap: 8px; }
.assure li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--weed); flex: none; }
.hero-art { display: block; width: 100%; height: auto; max-width: 580px; justify-self: end; }
@media (max-width: 860px) { .hero { grid-template-columns: 1fr; gap: var(--s4); padding-block: var(--s4) var(--s6); } .hero-art { justify-self: center; max-width: 460px; } }
@media (prefers-reduced-motion: no-preference) {
  .swim-a { animation: bob 6s ease-in-out infinite; }
  .swim-b { animation: bob 4.6s ease-in-out -1.2s infinite; }
  .swim-c { animation: bob 5.4s ease-in-out -2.6s infinite; }
  .sway { transform-box: fill-box; transform-origin: 50% 100%; animation: sway 7s ease-in-out infinite; }
  .sway-2 { animation-delay: -3s; }
  .bub { transform-box: fill-box; animation: rise 3.6s linear infinite; }
  .bub:nth-of-type(2) { animation-delay: -0.7s; } .bub:nth-of-type(3) { animation-delay: -1.4s; } .bub:nth-of-type(4) { animation-delay: -2.1s; } .bub:nth-of-type(5) { animation-delay: -2.8s; }
}
@keyframes bob { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(12px, -7px); } }
@keyframes sway { 0%, 100% { transform: rotate(-2.5deg); } 50% { transform: rotate(2.5deg); } }
@keyframes rise { 0% { transform: translateY(0); opacity: .95; } 100% { transform: translateY(-34px); opacity: .15; } }
.how { padding-block: var(--s7); }
.path-card { display: grid; gap: var(--s4); align-content: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: var(--s5); }
.path-card .steps { margin-top: 0; }
.path-card .btn { justify-self: start; }
.band { background: var(--ink); color: #FFFFFF; }
.band .btn-secondary { background: transparent; color: #FFFFFF; border-color: rgba(255,255,255,.5); }
.band .btn-secondary:hover { border-color: #FFFFFF; color: #FFFFFF; }
.band .wrap { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: var(--s5); align-items: center; padding-block: var(--s5); }
.band p { max-width: 70ch; }
.band .sdg { font-family: var(--f-mono); font-size: var(--t-xs); text-transform: uppercase; letter-spacing: .1em; border: 1px solid currentColor; padding: 4px 8px; border-radius: var(--r-sm); white-space: nowrap; }
@media (max-width: 700px) { .band .wrap { grid-template-columns: 1fr; gap: var(--s3); } }
.journeys { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s7); padding-block: var(--s7); }
@media (max-width: 760px) { .journeys { grid-template-columns: 1fr; gap: var(--s6); } }
.steps { list-style: none; padding: 0; margin: var(--s4) 0 0; display: grid; gap: 0; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 36px 1fr; gap: var(--s3); padding: var(--s3) 0; border-top: 1px solid var(--line); }
.steps li::before { content: counter(s); font-family: var(--f-mono); font-size: var(--t-sm); color: var(--primary); padding-top: 1px; }
.steps b { font-family: var(--f-display); font-weight: 600; }
.steps p { color: var(--ink-2); font-size: var(--t-sm); }

/* Questionnaire */
.progress { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; list-style: none; padding: 0; margin: 0 0 var(--s5); }
.progress li { display: grid; gap: 6px; font-size: var(--t-xs); color: var(--ink-2); }
.progress li::before { content: ""; height: 4px; border-radius: 2px; background: var(--line); }
.progress li.done::before, .progress li.now::before { background: var(--primary); }
.progress li.now { color: var(--ink); font-weight: 700; }
@media (max-width: 560px) { .progress li span { display: none; } .progress li.now span { display: inline; } }
.qwrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--s6); align-items: start; }
@media (max-width: 900px) { .qwrap { grid-template-columns: 1fr; } }
.form-foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: var(--s3); padding-top: var(--s5); margin-top: var(--s5); border-top: 1px solid var(--line); }
.care { display: grid; gap: var(--s3); }
.care dl { display: grid; grid-template-columns: auto 1fr; gap: 6px var(--s4); margin: 0; font-size: var(--t-sm); }
.care dt { color: var(--ink-2); }
.care dd { margin: 0; font-family: var(--f-mono); font-size: 0.8125rem; }

/* Review table */

/* ---------- Mock Requests service (S-08): the one place request state changes ---------- */
const RequestService = {
  submit({ listingId, adopterId, habitatId, intro, compat }) {
    const l = L(listingId);
    if (!l || l.status !== 'active') throw new Error('This listing is no longer accepting requests.');
    if (l.owner === adopterId) throw new Error('You cannot request your own listing.');
    if (compat !== 'potential_match') throw new Error('Only a potential match can be sent to the owner.');
    if (S.requests.some(r => r.listingId === listingId && r.adopter === adopterId && ['pending','accepted'].includes(r.status))) throw new Error('You already have an open request for this listing.');
    const r = { id: 'R-' + (S.seq.request++), listingId, adopter: adopterId, habitatId, compat, intro, status: 'pending', ownerConfirmed: false, adopterConfirmed: false, created: today(), summary: safeSummary(H(habitatId)) };
    S.requests.unshift(r); save(); return r;
  },
  listForOwner(ownerId) { return S.requests.filter(r => L(r.listingId)?.owner === ownerId); },
  listForAdopter(adopterId) { return S.requests.filter(r => r.adopter === adopterId); },
  withdraw(id, by) { const r = R(id); if (r.adopter !== by || r.status !== 'pending') throw new Error('Only a pending request can be withdrawn.'); r.status = 'withdrawn'; save(); },
  accept(id, by) {
    const r = R(id), l = L(r.listingId);
    if (l.owner !== by) throw new Error('Only the listing owner can accept.');
    if (S.requests.some(x => x.listingId === l.id && x.status === 'accepted')) throw new Error('This listing already has an accepted request.');
    r.status = 'accepted'; l.status = 'reserved'; save();
  },
  decline(id, by) { const r = R(id); if (L(r.listingId).owner !== by) throw new Error('Only the listing owner can decline.'); r.status = 'declined'; save(); },
  confirmHandover(id, by) {
    const r = R(id), l = L(r.listingId);
    if (r.status !== 'accepted') throw new Error('Handover can only be confirmed on an accepted request.');
    if (l.owner === by) r.ownerConfirmed = true; else if (r.adopter === by) r.adopterConfirmed = true; else throw new Error('You are not part of this request.');
    if (r.ownerConfirmed && r.adopterConfirmed) {
      r.status = 'completed'; l.status = 'rehomed';
      S.requests.forEach(x => { if (x.listingId === l.id && x.status === 'pending') x.status = 'declined'; });
    }
    save();
  },
};

/* ---------- Guidance (Farhan) and compatibility (Midhir) example rules ---------- */
function evaluateIntake(a) {
  const s = SPECIES[a.speciesId];
  const reasons = [];
  if (!s) return { outcome:'needs_review', reasons:['No species was selected.'] };
  if (s.status === 'restricted') {
    reasons.push(`${s.common} is in our example list of restricted species.`, 'Ordinary listings cannot be published for restricted species.');
    return { outcome:'restricted', reasons };
  }
  if (s.status === 'unknown') reasons.push('The organism has not been identified, so we cannot check whether it is restricted or what care it needs.');
  if (a.condition === 'unwell') reasons.push('It is unwell or under treatment. Moving it now could spread disease to an adopter’s tank or pond.');
  if (reasons.length) return { outcome:'needs_review', reasons };
  reasons.push(`${s.common} is a supported species with care information on AquaBridge.`, `Condition is recorded as “${CONDITION[a.condition].toLowerCase()}”.`, 'Nothing in your answers suggests a restriction.');
  return { outcome:'eligible', reasons };
}
function evaluateCompat(l, h) {
  const s = sp(l), checks = [];
  const add = (label, status, detail, bar) => checks.push({ label, status, detail, bar });
  // Habitat type (hard rule)
  if (s.habitats.includes(h.type)) add('Habitat type', 'pass', `${s.common} can live in a ${h.type}.`);
  else add('Habitat type', 'fail', `${s.common} needs a ${s.habitats.join(' or ')}. Your habitat is a ${h.type}.`);
  // Temperature (hard rule)
  if (blank(h.tempMin) || blank(h.tempMax)) add('Water temperature', 'missing', 'Add the lowest and highest temperature your water usually reaches.');
  else {
    const ok = +h.tempMin >= s.temp[0] && +h.tempMax <= s.temp[1];
    add('Water temperature', ok ? 'pass' : 'fail', ok ? `Your ${h.tempMin}–${h.tempMax} °C sits inside the ${s.temp[0]}–${s.temp[1]} °C range.` : `Your ${h.tempMin}–${h.tempMax} °C goes outside the ${s.temp[0]}–${s.temp[1]} °C this species needs.`,
      { lo:0, hi:32, min:s.temp[0], max:s.temp[1], a:+h.tempMin, b:+h.tempMax, ok, unit:'°C' });
  }
  // pH (advice only — it can be adjusted)
  if (blank(h.ph)) add('pH', 'missing', 'Add your pH reading. A liquid test kit gives a more reliable value than strips.');
  else {
    const ok = +h.ph >= s.ph[0] && +h.ph <= s.ph[1];
    add('pH', ok ? 'pass' : 'advice', ok ? `pH ${(+h.ph).toFixed(1)} is inside ${s.ph[0].toFixed(1)}–${s.ph[1].toFixed(1)}.` : `pH ${(+h.ph).toFixed(1)} is outside ${s.ph[0].toFixed(1)}–${s.ph[1].toFixed(1)}. Talk to the owner about adjusting it slowly before handover.`,
      { lo:5, hi:9, min:s.ph[0], max:s.ph[1], a:+h.ph, b:+h.ph, ok, unit:'pH' });
  }
  // Volume (hard rule)
  if (blank(h.volume)) add('Water volume', 'missing', 'Add how many litres your tank or pond holds.');
  else add('Water volume', +h.volume >= s.minVol ? 'pass' : 'fail', +h.volume >= s.minVol ? `${h.volume} L meets the ${s.minVol} L minimum.` : `${h.volume} L is below the ${s.minVol} L minimum for this listing.`);
  if (s.kind === 'animal') {
    if (blank(h.filter)) add('Filtration', 'missing', 'Tell us whether the habitat has a filter.');
    else add('Filtration', h.filter === 'yes' ? 'pass' : 'fail', h.filter === 'yes' ? 'A filter is running.' : 'Fish and shrimp need a running filter.');
    if (blank(h.cycled) || h.cycled === 'unsure') add('Cycled water', 'missing', 'Confirm whether the filter is cycled. Testing for ammonia and nitrite will tell you.');
    else add('Cycled water', h.cycled === 'yes' ? 'pass' : 'advice', h.cycled === 'yes' ? 'The filter is cycled.' : 'Cycle the filter before the handover so ammonia does not build up.');
  }
  if (s.minDepth) {
    if (blank(h.depth)) add('Pond depth', 'missing', 'Add the depth of the deepest part of your pond.');
    else add('Pond depth', +h.depth >= s.minDepth ? 'pass' : 'fail', +h.depth >= s.minDepth ? `${h.depth} cm is deep enough.` : `Needs at least ${s.minDepth} cm.`);
  }
  if (s.light && h.light && s.light !== h.light) add('Lighting', 'advice', `${s.common} prefers ${s.light} light. Yours is ${h.light}.`);
  const outcome = checks.some(c => c.status === 'fail') ? 'blocked' : checks.some(c => c.status === 'missing') ? 'needs_information' : 'potential_match';
  return { outcome, checks };
}

/* Questionnaire */
const STEPS = ['Organism', 'Species', 'Condition', 'Location'];
function progress(n) { return `<ol class="progress" aria-label="Step ${n} of 4">${STEPS.map((t, i) => `<li class="${i + 1 < n ? 'done' : i + 1 === n ? 'now' : ''}" ${i + 1 === n ? 'aria-current="step"' : ''}><span>${i + 1}. ${t}</span></li>`).join('')}</ol>`; }
function fieldErr(k) { return ui.errors?.[k] ? `<span class="err" id="e-${k}">${esc(ui.errors[k])}</span>` : ''; }
function errCls(k) { return ui.errors?.[k] ? 'has-error' : ''; }
function careWidget(id) {
  const s = SPECIES[id];
  if (!s) return `<div class="panel-quiet small muted">Pick a species to see its care reference.</div>`;
  return `<div class="panel care"><span class="label">Species guide · ${id}</span><h3>${esc(s.common)}</h3><p class="small"><i>${esc(s.sci)}</i></p>
    ${s.temp ? `<dl><dt>Temperature</dt><dd>${s.temp[0]}–${s.temp[1]} °C</dd><dt>pH</dt><dd>${s.ph[0].toFixed(1)}–${s.ph[1].toFixed(1)}</dd><dt>Min. volume</dt><dd>${s.minVol} L</dd><dt>Habitat</dt><dd>${s.habitats.join(', ')}</dd></dl>` : ''}
    ${s.status !== 'supported' ? `<div class="notice ${s.status === 'restricted' ? 'bad' : 'warn'}"><strong>${s.status === 'restricted' ? 'Restricted example' : 'Not identified'}</strong></div>` : ''}
    <p class="small">${esc(s.care)}</p></div>`;
}
function renderRehome() {
  const a = S.intake.answers, n = S.intake.step;

      <fieldset class="field ${errCls('condition')}"><legend>How is it doing? <span class="req">*</span></legend>
        <div class="choices">${Object.entries(CONDITION).map(([k, v]) => `<label class="choice"><input type="radio" name="condition" value="${k}" ${a.condition === k ? 'checked' : ''} data-rerender><strong>${v}</strong></label>`).join('')}</div>${fieldErr('condition')}</fieldset>
      ${a.condition && a.condition !== 'healthy' ? `<div class="field ${errCls('health')}"><label for="health">Describe the problem or treatment <span class="req">*</span></label><textarea id="health" name="health" placeholder="${a.kind === 'plant' ? 'e.g. some yellowing leaves, snails present' : 'e.g. white spot, treated with salt for a week'}">${esc(a.health ?? '')}</textarea>${fieldErr('health')}</div>` : ''}
      <div class="field ${errCls('reason')}"><label for="reason">Why are you rehoming? <span class="req">*</span></label><select id="reason" name="reason"><option value="">Choose a reason</option>${Object.entries(REASON).map(([k, v]) => `<option value="${k}" ${a.reason === k ? 'selected' : ''}>${v}</option>`).join('')}</select>${fieldErr('reason')}</div>

  if (n === 4) body = `<div class="stack"><h2>Location and timing</h2>

          <div class="choices">${Object.entries(URGENCY).map(([k, v]) => `<label class="choice"><input type="radio" name="urgency" value="${k}" ${a.urgency === k ? 'checked' : ''}><strong>${v}</strong></label>`).join('')}</div>${fieldErr('urgency')}</fieldset>
        <div class="field full"><label for="details">Anything else an adopter should know?</label><textarea id="details" name="details" placeholder="Tank mates, feeding, equipment you could include">${esc(a.details ?? '')}</textarea></div>

      </aside>
    </div>
  </div>`;
}
function readForm(f) { const d = {}; new FormData(f).forEach((v, k) => d[k] = typeof v === 'string' ? v.trim() : v); return d; }
function validateStep(n, a) {
  const e = {};
  if (n === 1 && !a.kind) e.kind = 'Choose an animal or a plant.';
  if (n === 2) { if (!a.speciesId) e.speciesId = 'Choose a species, or pick “I’m not sure”.'; if (!(+a.quantity >= 1)) e.quantity = 'Enter a number of 1 or more.'; }
  if (n === 3) { if (!a.condition) e.condition = 'Choose the closest description.'; if (a.condition && a.condition !== 'healthy' && !a.health) e.health = 'Describe the problem so we can give the right guidance.'; if (!a.reason) e.reason = 'Choose a reason.'; }
  if (n === 4) { if (!a.location || a.location.length < 3) e.location = 'Enter a town and postcode district, like “Ealing, W5”.'; if (!a.urgency) e.urgency = 'Choose how soon.'; }
  return e;
}

function renderReview() {

    <div class="qwrap">
      <div class="panel">
        ${group('Organism', 1, row('Type', a.kind === 'plant' ? 'Plant' : 'Animal'))}

function validateListing(d) {
  const e = {};
  if (!d.title || d.title.length < 10) e.title = 'Use at least 10 characters.';
  if (!(+d.qty >= 1)) e.qty = 'Enter 1 or more.';
  if (!d.location || d.location.length < 3) e.location = 'Add a town and postcode district.';
  if (!d.description || d.description.length < 40) e.description = `Add a bit more detail (${(d.description || '').length}/40 characters).`;
  return e;
}

function tracker(r) {
  const steps = [['Request accepted', ['accepted','completed'].includes(r.status)], ['Owner confirmed', r.ownerConfirmed], ['Adopter confirmed', r.adopterConfirmed], ['Rehoming complete', r.status === 'completed']];

  return `<ol class="track" aria-label="Handover progress">${steps.map(([t, d], i) => `<li class="${d ? 'done' : i === firstTodo ? 'now' : ''}">${t}${d ? '<span class="skip"> (done)</span>' : ''}</li>`).join('')}</ol>`;
}

function rbar(b) {
  const pc = v => Math.max(0, Math.min(100, (v - b.lo) / (b.hi - b.lo) * 100));
  const ticks = b.unit === 'pH' ? [5,6,7,8,9] : [0,8,16,24,32];
  return `<div aria-hidden="true"><div class="rbar"><div class="trk"></div><div class="ok-range" style="left:${pc(b.min)}%;width:${pc(b.max) - pc(b.min)}%"></div><div class="hab ${b.ok ? '' : 'fail'}" style="left:calc(${pc(b.a)}% - 2px);width:calc(${pc(b.b) - pc(b.a)}% + 4px)"></div></div>
    <div class="rbar-scale">${ticks.map(t => `<span>${t}${b.unit === '°C' ? '°' : ''}</span>`).join('')}</div></div>`;
}

let tour = null; // { flow, i, min }
function showStep() {
  const f = FLOWS[tour.flow], st = f.steps[tour.i];
  const keepNotes = S.notes;
  S = seed(); S.notes = keepNotes;
  f.setup?.(S);
  for (let j = 0; j <= tour.i; j++) f.steps[j].apply?.(S);
  save();
  navOpen = false; acctOpen = false;
  ui = {}; view = { name: st.route, params: st.params || {} };
  const extra = typeof st.ui === 'function' ? st.ui() : st.ui;
  if (extra) Object.assign(ui, extra);
  render(); renderTour();
  const el = st.hl && document.querySelector('#main ' + st.hl);
  if (el) { el.classList.add('tour-hl'); el.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  else window.scrollTo({ top: 0 });
}
function renderTour() {
  document.body.classList.toggle('touring', !!tour);
  const box = $('#tour');
  if (!tour) { box.innerHTML = ''; return; }
  const f = FLOWS[tour.flow], st = f.steps[tour.i], n = f.steps.length;
  box.innerHTML = tour.min
    ? `<button class="btn btn-primary tour-pill" data-act="tourMin">${esc(f.short)} · step ${tour.i + 1} of ${n} · Show guide</button>`
    : `<section class="tour" aria-label="Demo guide" aria-live="polite">
      <div class="tour-top"><span class="label">${esc(f.short)}</span><button class="btn btn-quiet btn-sm" data-act="tourMin">Minimise</button></div>
      <div class="tour-prog" aria-hidden="true"><span style="width:${(tour.i + 1) / n * 100}%"></span></div>
      <p class="small muted">Step ${tour.i + 1} of ${n} · <strong style="color:var(--ink)">${esc(st.actor)}</strong></p>
      <h3>${esc(st.title)}</h3>
      <p>${esc(st.say)}</p>
      <div class="tour-sys"><span class="label">Behind the scenes</span><p>${st.sys}</p><span class="tour-who">${esc(st.who)}</span></div>
      <div class="row between"><button class="btn btn-secondary btn-sm" data-act="tourBack" ${tour.i === 0 ? 'disabled' : ''}>Back</button>
        <div class="row" style="gap:6px"><button class="btn btn-quiet btn-sm" data-act="tourExit">Exit</button><button class="btn btn-primary btn-sm" data-act="tourNext">${tour.i === n - 1 ? 'Finish' : 'Next step'}</button></div></div>
    </section>`;
}
function renderDemos() {
  return `<div class="wrap page">
    <div class="page-head"><p class="label">Team walkthrough</p><h1>Demo flows</h1>
      <p>Three guided walkthroughs that cover both journeys from start to finish. Each one starts from fresh sample data. A guide panel says what the user does, what happens in the system and who builds it. Press Next and the prototype does the action for you.</p></div>
    <div class="demo-grid">${Object.entries(FLOWS).map(([k, f]) => `<article class="path-card">
      <div class="stack" style="gap:6px"><p class="label">${esc(f.label)}</p><h2>${esc(f.title)}</h2><p class="muted">${esc(f.summary)}</p></div>
      <button class="btn btn-primary" data-act="tourStart" data-flow="${k}">Start this demo</button>
      <ol class="steps">${f.steps.map(s => `<li><div><b>${esc(s.title)}</b><p>${esc(s.actor)}</p></div></li>`).join('')}</ol>
      <p class="mono small muted">${esc(f.covers)}</p>
    </article>`).join('')}</div>
  </div>`;
}

/* ---------- Event wiring ---------- */
const actions = {
  tourStart(el) { tour = { flow: el.dataset.flow, i: 0, min: false }; showStep(); },
  tourNext() { if (tour.i < FLOWS[tour.flow].steps.length - 1) { tour.i++; showStep(); } else { tour = null; renderTour(); go('demos'); toast('Demo finished'); } },
  tourBack() { if (tour.i > 0) { tour.i--; showStep(); } },
  tourExit() { tour = null; renderTour(); go('demos'); },
  tourMin() { tour.min = !tour.min; renderTour(); },
  menu() { navOpen = !navOpen; renderHead(); $('.menu-btn').focus(); },
  acctMenu() { acctOpen = !acctOpen; renderHead(); (acctOpen ? $('#acctPanel .dd-item') : $('.dd-btn'))?.focus(); },
  howItWorks() {
    if (view.name !== 'home') go('home', {}, { keepFocus: true }); else { navOpen = false; renderHead(); }
    const how = document.getElementById('how');
    how.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    how.querySelector('h2').focus({ preventScroll: true });
  },
  toggleNotes() { S.notes = !S.notes; save(); renderNotes(); },
  reset() { tour = null; renderTour(); const keep = S.notes; S = seed(); S.notes = keep; save(); ui = {}; go('home'); toast('Sample data reset'); },
  signout() { S.user = null; save(); go('home'); toast('Signed out'); },
  filter(el) { ui[el.dataset.key] = el.dataset.val; render(); },
  clearFilters() { ui.kind = 'all'; ui.q = ''; ui.hab = 'any'; render(); },
  intakeBack() { captureIntake(); S.intake.step--; ui.errors = null; save(); render(); },
  editStep(el) { S.intake.step = +el.dataset.step; save(); go('rehome'); },
  submitIntake() { S.intake.id = S.intake.id || 'IC-' + (S.seq.intake++); S.intake.outcome = evaluateIntake(S.intake.answers); save(); go('guidance'); },
  newIntake() { S.intake = { step:1, answers:{}, outcome:null }; save(); go('rehome'); },
  createFromIntake() { go('editor', { fromIntake: true }); },
  authTab(el) { ui.tab = el.dataset.tab; render(); },
  saveDraft() { saveListing('draft'); },
  lTab(el) { ui.tab = el.dataset.tab; render(); },
  askWithdraw(el) { ui.confirm = el.dataset.id; render(); },
  cancelConfirm() { ui.confirm = null; render(); },
  withdrawListing(el) { const l = L(el.dataset.id); l.status = 'withdrawn'; S.requests.forEach(r => { if (r.listingId === l.id && r.status === 'pending') r.status = 'declined'; }); ui.confirm = null; save(); render(); toast('Listing withdrawn'); },
  publishListing(el) { const l = L(el.dataset.id); const e = validateListing(l); if (Object.keys(e).length) { go('editor', { id: l.id }); ui.errors = e; render(); return; } l.status = 'active'; save(); render(); toast('Published. It now appears in Browse.'); },
  restoreListing(el) { L(el.dataset.id).status = 'draft'; save(); render(); toast('Moved to drafts'); },
  selReq(el) { ui.sel = el.dataset.id; ui.confirm = null; render(); },
  accept(el) { tryService(() => RequestService.accept(el.dataset.id, S.user), 'Request accepted. The listing is now reserved.'); },
  askDecline(el) { ui.confirm = el.dataset.id + 'decline'; render(); },
  decline(el) { tryService(() => RequestService.decline(el.dataset.id, S.user), 'Request declined'); ui.confirm = null; render(); },
  ownerConfirm(el) { tryService(() => RequestService.confirmHandover(el.dataset.id, S.user), 'Handover confirmed'); },
  simAdopterConfirm(el) { const r = R(el.dataset.id); tryService(() => RequestService.confirmHandover(r.id, r.adopter), 'Adopter confirmed the handover'); },
  adopterConfirm(el) { tryService(() => RequestService.confirmHandover(el.dataset.id, S.user), 'Handover confirmed'); },
  askWithdrawReq(el) { ui.confirm = el.dataset.id; render(); },
  withdrawReq(el) { ui.confirm = null; tryService(() => RequestService.withdraw(el.dataset.id, S.user), 'Request withdrawn'); },
  simAccept(el) { const r = R(el.dataset.id); tryService(() => RequestService.accept(r.id, L(r.listingId).owner), 'The owner accepted your request'); },
  simDecline(el) { const r = R(el.dataset.id); tryService(() => RequestService.decline(r.id, L(r.listingId).owner), 'The owner declined your request'); },
  habEdit(el) { ui.hDraft = null; ui.errors = null; go('habitat', { edit: el.dataset.id }); },
  habCancel() { const back = S.pending?.returnTo; if (back) { S.pending = null; save(); go('compat', back); } else go('habitat'); },
  habForCompat(el) { S.pending = { returnTo: { id: view.params.id } }; save(); ui.hDraft = null; go('habitat', { edit: el.dataset.id }); },
  openScreen(el) {
    const k = el.dataset.route;
    const needs = { listing:{ id:'L-1045' }, compat:{ id:'L-1045' }, request:{ id:'L-1045', hab:'H-201' }, editor:{ id:'L-1048' } };
    if (['review','guidance'].includes(k) && !S.intake.answers.speciesId) { S.intake.answers = { kind:'animal', speciesId:'SP-002', quantity:'6', condition:'healthy', reason:'moving', location:'Uxbridge, UB8', urgency:'month' }; S.intake.outcome = evaluateIntake(S.intake.answers); save(); }
    go(k, needs[k] || {});
  },
};
function tryService(fn, okMsg) { try { fn(); toast(okMsg); } catch (e) { toast(e.message); } render(); }
function captureIntake() { const f = $('form[data-form="intake"]'); if (f) Object.assign(S.intake.answers, readForm(f)); }
function captureDraft() {
  const f = $('form[data-form="listing"]'); if (!f) return;
  const d = readForm(f); ui.draft = { ...ui.draft, ...d, qty: d.qty };
}
function saveListing(status) {
  captureDraft();
  const d = ui.draft;
  const e = status === 'active' ? validateListing(d) : (!d.title ? { title: 'Add a title to save a draft.' } : {});
  ui.errors = e;
  if (Object.keys(e).length) { render(); const first = $('.has-error input, .has-error textarea'); first && first.focus(); return; }
  const wasActive = d.status === 'active';
  if (!d.id) { d.id = 'L-' + (S.seq.listing++); d.owner = S.user; d.created = today(); S.listings.unshift({ ...d, status }); }
  else Object.assign(L(d.id), { ...d, status: wasActive ? 'active' : status });
  if (d.intakeId) S.intake = { step:1, answers:{}, outcome:null };
  save(); ui = {};
  go('mylistings');
  toast(status === 'active' ? (wasActive ? 'Changes saved' : 'Published. It now appears in Browse.') : 'Draft saved');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && (acctOpen || navOpen)) { const was = acctOpen; acctOpen = false; navOpen = false; renderHead(); $(was ? '.dd-btn' : '.menu-btn')?.focus(); }
});
document.addEventListener('click', e => {
  if (acctOpen && !e.target.closest('.dd')) { acctOpen = false; renderHead(); }
  const a = e.target.closest('[data-act]');
  if (a) { e.preventDefault(); actions[a.dataset.act]?.(a); return; }
  const g = e.target.closest('[data-go]');
  if (g) {
    e.preventDefault();
    const p = {}; if (g.dataset.id) p.id = g.dataset.id; if (g.dataset.hab) p.hab = g.dataset.hab; if (g.dataset.listing) p.listing = g.dataset.listing;
    if (g.dataset.tab) { go(g.dataset.go, p); ui.tab = g.dataset.tab; render(); return; }
    if (g.dataset.go === 'signin') S.pending = null;
    go(g.dataset.go, p);
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.matches('[data-act-change="pickHab"]')) { ui.hab = t.value; render(); return; }
  if (t.matches('[data-rerender]')) {
    if (t.form?.dataset.form === 'intake') { captureIntake(); if (t.name === 'kind') { delete S.intake.answers.speciesId; } save(); }
    if (t.form?.dataset.form === 'habitat') Object.assign(ui.hDraft, readForm(t.form));
    const id = t.id; render(); const again = id && document.getElementById(id); (again || $(`[name="${t.name}"]:checked`))?.focus();
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.live === 'q') { ui.q = t.value; const pos = t.selectionStart; render(); const q = $('#q'); q.focus(); q.setSelectionRange(pos, pos); }
  if (t.dataset.live === 'draft') { captureDraft(); $('#preview').innerHTML = card({ ...ui.draft, id: ui.draft.id || 'L-new' }); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form;
  if (kind === 'intake') {
    captureIntake();
    const errs = validateStep(S.intake.step, S.intake.answers);
    ui.errors = errs;
    if (Object.keys(errs).length) { save(); render(); $('.has-error input, .has-error select, .has-error textarea')?.focus(); return; }
    ui.errors = null;
    if (S.intake.step < 4) { S.intake.step++; save(); render(); window.scrollTo({ top: 0 }); } else { save(); go('review'); }
  }
  if (kind === 'signin') {
    S.user = ME; const p = S.pending; S.pending = null; save();
    toast('Signed in as Jordan Lee (sample user)');
    if (p && p.name) go(p.name, p.params); else go('mylistings');
  }
  if (kind === 'listing') saveListing('active');
  if (kind === 'habitat') {
    const d = { ...ui.hDraft, ...readForm(f) };
    ['volume','tempMin','tempMax','ph','depth'].forEach(k => d[k] = d[k] === '' || d[k] === undefined ? '' : +d[k]);
    const err = {};
    if (!d.name) err.name = 'Give this habitat a name.';
    if (d.volume !== '' && (d.volume < 5 || d.volume > 100000)) err.volume = 'Enter between 5 and 100,000 litres.';
    if (d.ph !== '' && (d.ph < 4 || d.ph > 10)) err.ph = 'pH is usually between 4 and 10.';
    if (d.tempMin !== '' && d.tempMax !== '' && d.tempMin > d.tempMax) err.tempMax = 'Highest must be at least the lowest.';
    if ((d.tempMin === '') !== (d.tempMax === '')) err[d.tempMin === '' ? 'tempMin' : 'tempMax'] = 'Add both temperatures, or leave both blank.';
    ui.hDraft = d; ui.errors = err;
    if (Object.keys(err).length) { render(); return; }
    if (!d.id) { d.id = 'H-' + (S.seq.habitat++); S.habitats.push(d); } else Object.assign(H(d.id), d);
    const back = S.pending?.returnTo; S.pending = null; save();
    toast('Habitat saved');
    if (back) go('compat', back), ui.hab = d.id, render(); else go('habitat');
  }
  if (kind === 'request') {
    const d = readForm(f); ui.intro = d.intro; const err = {};
    if (!d.intro || d.intro.length < 30) err.intro = `Write a little more (${(d.intro || '').length}/30 characters).`;
    if (!f.ack.checked) err.ack = 'Tick the box to continue.';
    ui.errors = err; ui.serviceError = null;
    if (Object.keys(err).length) { render(); return; }
    const { id, hab } = view.params;
    try {
      const r = RequestService.submit({ listingId: id, adopterId: S.user, habitatId: hab, intro: d.intro, compat: evaluateCompat(L(id), H(hab)).outcome });
      go('myrequests'); toast(`Request ${r.id} sent to ${USERS[L(id).owner].short}`);
    } catch (ex) { ui.serviceError = ex.message; render(); }
  }
});

// Open the screen named in the link (#browse, #rehome, #design, #map …)
const start = (location.hash || '').slice(1);
go(ROUTES[start] && !['listing','compat','request','review','guidance'].includes(start) ? start : 'home', {}, { keepFocus: true });
